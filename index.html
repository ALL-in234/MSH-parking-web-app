<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>停車場進出預約系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-gray-100 min-h-screen">
    <div class="container mx-auto p-4 md:p-8 max-w-6xl">
        <header class="text-center mb-8">
            <h1 class="text-4xl font-bold text-blue-800 mb-2">🚗 停車場進出預約系統</h1>
            <p class="text-gray-600">實時剩餘車位顯示 · 進出預約管理</p>
        </header>

        <!-- 實時統計 -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-white rounded-xl shadow-lg p-6 border-l-4 border-blue-500">
                <h2 class="text-sm font-medium text-gray-500 uppercase">總車位</h2>
                <p id="totalSpots" class="text-4xl font-bold text-blue-600 mt-2">50</p>
            </div>
            <div class="bg-white rounded-xl shadow-lg p-6 border-l-4 border-green-500">
                <h2 class="text-sm font-medium text-gray-500 uppercase">剩餘車位 (實時)</h2>
                <p id="availableSpots" class="text-4xl font-bold text-green-600 mt-2">50</p>
            </div>
            <div class="bg-white rounded-xl shadow-lg p-6 border-l-4 border-red-500">
                <h2 class="text-sm font-medium text-gray-500 uppercase">當前佔用</h2>
                <p id="occupiedSpots" class="text-4xl font-bold text-red-600 mt-2">0</p>
            </div>
        </div>

        <!-- 預約表單 -->
        <div class="bg-white rounded-xl shadow-lg p-6 mb-8">
            <h2 class="text-2xl font-semibold text-gray-800 mb-4">新增進出預約</h2>
            <form id="reservationForm" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">車牌號碼</label>
                    <input type="text" id="plate" placeholder="例如：AB1234" required 
                           class="w-full border border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">進入時間</label>
                    <input type="datetime-local" id="entryTime" required 
                           class="w-full border border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">離開時間</label>
                    <input type="datetime-local" id="exitTime" required 
                           class="w-full border border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </div>
                <div class="flex items-end">
                    <button type="submit" 
                            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-lg transition duration-200">
                        確認預約
                    </button>
                </div>
            </form>
            <p id="message" class="mt-3 text-sm font-medium"></p>
        </div>

        <!-- 預約列表 -->
        <div class="bg-white rounded-xl shadow-lg p-6">
            <h2 class="text-2xl font-semibold text-gray-800 mb-4">預約列表</h2>
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">車牌</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">進入時間</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">離開時間</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">狀態</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">操作</th>
                        </tr>
                    </thead>
                    <tbody id="reservationsBody" class="bg-white divide-y divide-gray-200"></tbody>
                </table>
            </div>
            <p id="noReservations" class="text-center text-gray-500 py-8 hidden">暫無預約記錄</p>
        </div>

        <footer class="text-center text-gray-500 text-sm mt-8">
            <p>數據儲存於瀏覽器本地 · 刷新頁面後仍保留 · 實時每 5 秒更新一次</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
